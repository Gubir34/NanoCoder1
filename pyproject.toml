[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcoder"
version = "0.1.0"
description = "A tiny local coding agent for your terminal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
server = ["torch", "transformers", "peft"]

[project.scripts]
agentcoder = "agentcoder:main"
agentcoder-server = "agentcoder_server:main"

[tool.setuptools]
py-modules = ["agentcoder", "agentcoder_server"]
